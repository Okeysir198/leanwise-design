# Token-core AA contrast gate.
#
# The one thing that must never drift silently: a brand fill + its ink pair dropping
# under WCAG AA (white on the LeanWise orange scores 2.80, on teal 2.49 — both fail).
# bin/lw-contrast-check.mjs parses tokens.css for the authored HSL triples and fails
# if any pair breaks. A human eyeballing a mockup did not catch this for months; a
# number in CI would have. Runs on every push/PR because it is pure Node, seconds.

name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contrast:
    name: WCAG AA contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Contrast check
        run: node bin/lw-contrast-check.mjs
