name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ci

      # Visual regression: record the base ref on this runner, then diff HEAD.
      # A head commit carrying [visual-ok] reports differences without failing.
      - name: Visual regression
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout --force --detach "$BASE"
          git checkout --force "$HEAD" -- scripts
          node scripts/check.mjs visual --record --dir "$RUNNER_TEMP/visual" || echo "::warning::base ref could not be recorded"
          git checkout --force --detach "$HEAD"
          FLAG=""; git log -1 --pretty=%B "$HEAD" | grep -qF '[visual-ok]' && FLAG="--report-only"
          node scripts/check.mjs visual --compare --dir "$RUNNER_TEMP/visual" $FLAG
