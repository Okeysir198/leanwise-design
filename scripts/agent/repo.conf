# Per-repo configuration for scripts/agent/run_agent.sh, which is shared
# byte-identical with other repos. Sourced as shell: plain `: "${VAR:=…}"`
# defaults only, so an environment variable always wins.
#
# This repo is public, so EXPECTED_ROOT (the ops clone's path) and any token
# path are NOT set here: they go in the uncommitted host file
# $AGENT_CONFIG_DIR/leanwise-design.conf. The run refuses to start without them.

: "${GH_REPO:=Okeysir198/leanwise-design}"
: "${AGENT_SLUG:=leanwise-design}"

# npm + package-lock.json. `npm ci`, never `npm install`: ci fails on a drifted
# lock, where install would rewrite it mid-run and hand the agent a tree that no
# longer matches origin/main.
: "${PKG_BIN:=npm}"
: "${INSTALL_CMD:=npm ci --no-audit --no-fund}"

# No `packageManager` pin in package.json, so no version to compare.
: "${PKG_VERSION_EXPECTED:=}"

# engines.node in package.json.
: "${NODE_VERSION_MIN:=20}"
