<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../preview/_vendor/react.js"></script>
<script src="../../preview/_vendor/react-dom.js"></script>
<script src="../_shared/support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App dashboard" description="shadcn dashboard-01 on the LeanWise theme: inset sidebar, site header, KPI section cards, the interactive area chart and the sortable data table." -->
<helmet><script src="../_shared/ds-base.js"></script></helmet>
<a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-background focus:px-3 focus:py-2" href="#main">Skip to content</a>
<div class="font-sans">
<x-import component-from-global-scope="LeanWiseDesign_f2d907.SidebarProvider" hint-size="100%,100%" style="{{ shellVars }}">
<x-import component-from-global-scope="LeanWiseDesign_f2d907.AppSidebar" hint-size="288px,100%" variant="inset"></x-import>
<main id="main" data-slot="sidebar-inset" class="bg-background relative flex w-full flex-1 flex-col md:peer-data-[variant=inset]:m-2 md:peer-data-[variant=inset]:ml-0 md:peer-data-[variant=inset]:rounded-xl md:peer-data-[variant=inset]:shadow-sm md:peer-data-[variant=inset]:peer-data-[state=collapsed]:ml-2">
<x-import component-from-global-scope="LeanWiseDesign_f2d907.SiteHeader" hint-size="100%,48px"></x-import>
<div class="flex flex-1 flex-col">
<div class="@container/main flex flex-1 flex-col gap-2">
<div class="flex flex-col gap-4 py-4 md:gap-6 md:py-6">
<x-import component-from-global-scope="LeanWiseDesign_f2d907.SectionCards" hint-size="100%,190px"></x-import>
<div class="px-4 lg:px-6">
<x-import component-from-global-scope="LeanWiseDesign_f2d907.ChartAreaInteractive" hint-size="100%,380px"></x-import>
</div>
<x-import component-from-global-scope="LeanWiseDesign_f2d907.DataTable" hint-size="100%,560px" data="{{ rows }}"></x-import>
</div>
</div>
</div>
</main>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
const ROWS = [
  ["Cover page", "Cover page", "In Process", "18", "5", "Eddie Lake"],
  ["Table of contents", "Table of contents", "Done", "29", "24", "Eddie Lake"],
  ["Executive summary", "Narrative", "Done", "10", "13", "Eddie Lake"],
  ["Technical approach", "Narrative", "Done", "27", "23", "Jamik Tashpulatov"],
  ["Design", "Narrative", "In Process", "2", "16", "Jamik Tashpulatov"],
  ["Capabilities", "Narrative", "In Process", "20", "8", "Jamik Tashpulatov"],
  ["Integration with existing systems", "Narrative", "In Process", "19", "21", "Jamik Tashpulatov"],
  ["Innovation and advantages", "Narrative", "Done", "25", "26", "Assign reviewer"],
  ["Overview of EMR's innovative solutions", "Technical content", "Done", "7", "23", "Assign reviewer"],
  ["Advanced algorithms and machine learning", "Narrative", "Done", "30", "28", "Assign reviewer"],
];

class Component extends DCLogic {
  renderVals() {
    return {
      shellVars: { "--sidebar-width": "calc(var(--spacing) * 72)", "--header-height": "calc(var(--spacing) * 12)" },
      rows: ROWS.map(([header, type, status, target, limit, reviewer], i) => ({ id: i + 1, header, type, status, target, limit, reviewer })),
    };
  }
}
</script>
</body>
</html>
