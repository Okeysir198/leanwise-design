<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 128" role="img" aria-label="LeanWise AI">
  <title>LeanWise AI</title>
  <!-- Stops mirror the lw-navy-700 and lw-brand-500 tokens as literals ON
       PURPOSE: CSS custom properties do not cascade into an SVG loaded through
       an img element, so a var() here would silently always render its
       fallback. Recolouring is the job of logo-mark-mono.svg (currentColor),
       which is meant to be inlined. If the brand ramp moves, regenerate with
       assets/build-logo.py. -->
  <defs>
    <linearGradient id="lwBrand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A4D7E"/>
      <stop offset="1" stop-color="#1AB0D5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#lwBrand)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56.00 4.00 L107.96 34.00 L107.96 94.00 L56.00 124.00 L4.04 94.00 L4.04 34.00 Z" stroke-width="6.46"/>
    <path d="M29.69 48.65 L47.23 68.14 L75.98 36.95" stroke-width="7.80"/>
    <path d="M11.17 89.83 L29.69 71.31 L45.52 93.48 L56.24 77.40 L61.36 86.90 L90.84 47.68" stroke-width="7.80"/>
    <path d="M75.98 36.95 L90.84 47.68" stroke-width="3.90"/>
  </g>
  <circle cx="75.98" cy="36.95" r="6.58" fill="url(#lwBrand)"/>
  <circle cx="90.84" cy="47.68" r="6.34" fill="url(#lwBrand)"/>
</svg>
