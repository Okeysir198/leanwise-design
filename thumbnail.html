<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LeanWise</title>
<link rel="stylesheet" href="preview/preview.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;overflow:hidden;display:flex}
.mark{flex:0 0 960px;height:854px;background:var(--navy);display:flex;align-items:center;justify-content:center}
/* The mono mark is currentColor inside an <img>, which paints black; the filter turns it white. */
.mark img{width:420px;height:420px;object-fit:contain;filter:brightness(0) invert(1)}
.strip{flex:1;height:854px;display:flex;flex-direction:column}.strip>div{flex:1}</style>
</head><body>
<div class="mark"><img src="assets/logo-mark-mono.svg" alt="LeanWise"></div>
<div class="strip"><div style="background:var(--cta)"></div><div style="background:var(--brand-400)"></div><div style="background:var(--primary)"></div></div>
</body></html>
